name: github-app-auth
version: 0.1.0
description: >
  GitHub App authentication for Hermes Agent. Provides tools to authenticate
  as a GitHub App installation and automatically scopes gh/git CLI credentials
  in terminal tool calls.
author: Jon Musselwhite
license: MIT
provides_tools:
  - github_app_login
  - github_app_logout
provides_hooks:
  - pre_llm_call
  - on_session_start
requires_env:
  - name: GITHUB_APP_CLIENT_ID
    description: The GitHub App's client ID (used as JWT issuer)
  - name: GITHUB_APP_PRIVATE_KEY
    description: PEM-format private key for signing GitHub App JWTs
    secret: true
python_dependencies:
  - PyJWT[crypto]>=2.8,<3
  - httpx>=0.24,<1
config_schema:
  author_name:
    type: str
    description: Git author name for commits created by the agent. When unset, derived from the GitHub App's name via GET /app.
  author_email:
    type: str
    description: Git author email for commits created by the agent. When unset, derived as {id}+{slug}[bot]@users.noreply.github.com from GET /app.
  committer_name:
    type: str
    description: Git committer name for commits created by the agent. When unset, derived from the GitHub App's name via GET /app.
  committer_email:
    type: str
    description: Git committer email for commits created by the agent. When unset, derived as {id}+{slug}[bot]@users.noreply.github.com from GET /app.
